<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Rohan Chawla: SDET I at Cyware Labs. +75% dev productivity, 500+ defects caught, -50% CI run time, 20+ critical cross-service bugs, +40% workflow efficiency, Codeforces 1200+.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#0f1733"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
      .fl { animation: bob 6s ease-in-out infinite; }
      .d1 { animation-duration: 5.2s; animation-delay: -1s; }
      .d2 { animation-duration: 6.4s; animation-delay: -2.5s; }
      .d3 { animation-duration: 5.8s; animation-delay: -4s; }
      .d4 { animation-duration: 7s;   animation-delay: -0.5s; }
      .d5 { animation-duration: 6.1s; animation-delay: -3.2s; }
      .d6 { animation-duration: 5.5s; animation-delay: -1.8s; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      .drift { animation: drift 14s linear infinite; }
      @keyframes drift { 0% { transform: translateY(40px); opacity: 0; } 15% { opacity: .8; } 85% { opacity: .8; } 100% { transform: translateY(-400px); opacity: 0; } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.5); } }
      .glow { animation: glow 8s ease-in-out infinite alternate; }
      @keyframes glow { from { opacity: .6; } to { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="glow" cx="930" cy="120" r="300" fill="url(#glowA)"/>
    <circle class="glow" cx="160" cy="360" r="260" fill="url(#glowB)"/>

    <!-- drifting particles -->
    <g fill="#a78bfa">
      <circle class="drift" cx="80"  cy="380" r="2.5" style="animation-delay:-2s"/>
      <circle class="drift" cx="250" cy="380" r="1.8" style="animation-delay:-7s;animation-duration:18s"/>
      <circle class="drift" cx="420" cy="380" r="2.2" style="animation-delay:-11s"/>
      <circle class="drift" cx="600" cy="380" r="1.6" style="animation-delay:-4s;animation-duration:16s"/>
      <circle class="drift" cx="760" cy="380" r="2.4" style="animation-delay:-9s"/>
      <circle class="drift" cx="1120" cy="380" r="2" style="animation-delay:-13s;animation-duration:17s"/>
    </g>
    <g fill="#67e8f9">
      <circle class="drift" cx="160" cy="380" r="1.6" style="animation-delay:-5s;animation-duration:19s"/>
      <circle class="drift" cx="520" cy="380" r="2" style="animation-delay:-1s;animation-duration:15s"/>
      <circle class="drift" cx="980" cy="380" r="1.8" style="animation-delay:-8s"/>
      <circle class="drift" cx="1180" cy="380" r="1.4" style="animation-delay:-3s;animation-duration:20s"/>
    </g>
  </g>

  <!-- Left: identity -->
  <text x="64" y="106" class="mono" font-size="18" fill="#94a3b8">~$ whoami<tspan class="blink" fill="#67e8f9"> ▍</tspan></text>
  <text x="62" y="178" font-size="66" font-weight="800" fill="url(#name)">Rohan Chawla</text>
  <text x="64" y="218" font-size="22" fill="#e2e8f0">SDET I @ <tspan font-weight="700" fill="#ffffff">Cyware Labs</tspan>  ·  Bangalore, India</text>


  <text x="64" y="268" class="mono" font-size="15" fill="#94a3b8">Python · Java · Microservices · Kubernetes · Kafka · LLM Evals · RAG</text>
  <text x="64" y="298" class="mono" font-size="15" fill="#64748b">// I build systems, break them on purpose, and make AI behave.</text>

  <!-- Right: floating figures -->
  <g font-weight="800">
    <g class="fl d1">
      <rect x="700" y="44" width="140" height="92" rx="16" fill="#0b1226" fill-opacity="0.85" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="770" y="92" text-anchor="middle" font-size="36" fill="#c4b5fd">+75%</text>
      <text x="770" y="118" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">dev productivity</text>
    </g>
    <g class="fl d2">
      <rect x="860" y="70" width="140" height="92" rx="16" fill="#0b1226" fill-opacity="0.85" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="930" y="118" text-anchor="middle" font-size="36" fill="#67e8f9">500+</text>
      <text x="930" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">defects caught</text>
    </g>
    <g class="fl d3">
      <rect x="1020" y="40" width="140" height="92" rx="16" fill="#0b1226" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.55"/>
      <text x="1090" y="88" text-anchor="middle" font-size="36" fill="#6ee7b7">−50%</text>
      <text x="1090" y="114" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">CI run time</text>
    </g>
    <g class="fl d4">
      <rect x="700" y="200" width="140" height="92" rx="16" fill="#0b1226" fill-opacity="0.85" stroke="#f472b6" stroke-opacity="0.55"/>
      <text x="770" y="248" text-anchor="middle" font-size="36" fill="#f9a8d4">20+</text>
      <text x="770" y="274" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">critical service bugs</text>
    </g>
    <g class="fl d5">
      <rect x="860" y="226" width="140" height="92" rx="16" fill="#0b1226" fill-opacity="0.85" stroke="#fbbf24" stroke-opacity="0.55"/>
      <text x="930" y="274" text-anchor="middle" font-size="36" fill="#fcd34d">+40%</text>
      <text x="930" y="300" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">workflow efficiency</text>
    </g>
    <g class="fl d6">
      <rect x="1020" y="196" width="140" height="92" rx="16" fill="#0b1226" fill-opacity="0.85" stroke="#60a5fa" stroke-opacity="0.55"/>
      <text x="1090" y="244" text-anchor="middle" font-size="36" fill="#93c5fd">1200+</text>
      <text x="1090" y="270" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">Codeforces rating</text>
    </g>
  </g>
</svg>
